<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reussitess® Global Nexus - Accédez à nos 26 boutiques Amazon dans 14 pays. Excellence, Innovation, Succès.">
    <meta name="theme-color" content="#007bff">
    <link rel="manifest" href="./manifest.json">
    <title>Reussitess® Global Nexus - VERSION FINALE CACHE FIX</title>
    
    <script type="module" src="./config.js"></script> 
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            text-align: center;
        }
        /* Style pour centrer le logo et le texte */
        h1 { 
            color: #007bff; 
            font-size: 2.5em; 
            margin-bottom: 10px; 
            /* Styles ajoutés pour le logo */
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px;
        }

        .subtitle { color: #666; font-size: 1.2em; margin-top: 10px; }
        .install-prompt {
            background: linear-gradient(135deg, #ff9500, #ffb84d);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }
        .install-prompt.show { display: block; }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-number { font-size: 3em; font-weight: bold; color: #ff9500; display: block; }
        <span class="stat-label">Boutiques</span>
            </div>
            <div class="stat-card">
                <span class="stat-number">14</span>
                <span class="stat-label">Pays</span>
            </div>
            <div class="stat-card">
                <span class="stat-number">28</span>
                <span class="stat-label">Collections</span>
            </div>
        </div>

        <h2 class="section-title" id="products-section" style="display:none;">🔥 Notre Sélection du Moment</h2>
        <div class="countries-grid" id="productShowcase">
            </div>
        <div class="filter-bar">
            <input type="text" class="search-box" id="searchBox" placeholder="🔍 Rechercher un pays...">
            <button class="filter-btn active" data-filter="all">Tous</button>
            <button class="filter-btn" data-filter="personal">Personnelles</button>
            <button class="filter-btn" data-filter="influencer">Influenceur</button>
        </div>
        
        <div class="no-results" id="noResults">
            <div style="font-size: 4em; margin-bottom: 20px;">🔍</div>
            <h3>Aucun résultat</h3>
            <p>Essayez avec un autre pays</p>
        </div>
        
        <main>
            <h2 class="section-title">🛍️ Boutiques Personnelles</h2>
            <div class="countries-grid">
                <div class="country-card" data-category="personal" data-country="united states usa">
                    <h3 class="country-name"><span class="flag">🇺🇸</span>United States</h3>
                    <p class="description">Discover my curated Amazon shop with top products for the USA!</p>
                    <a href="https://amzlink.to/b03867" class="shop-link" target="_blank" rel="nofollow sponsored noopener noreferrer">🛒 Visit USA Shop</a>
                    <p class="disclaimer">As an Amazon Associate, I earn from qualifying purchases.</p>
                </div>

                <div class="country-card" data-category="personal" data-country="france">
                    <h3 class="country-name"><span class="flag">🇫🇷</span>France</h3>
                    <p class="description">Découvrez ma boutique Amazon avec une sélection spéciale !</p>
                    <a href="#" id="link-france" class="shop-link" target="_blank" rel="nofollow sponsored noopener noreferrer">🛒 Visiter Boutique</a>
                    <p class="disclaimer">En tant que Partenaire Amazon, je réalise un bénéfice sur les achats.</p>
                </div>

                <div class="country-card" data-category="personal" data-country="italia italy">
                    <h3 class="country-name"><span class="flag">🇮🇹</span>Italia</h3>
                    <p class="description">Scopri il mio negozio Amazon con prodotti selezionati!</p>
                    <a href="https://amzlink.to/b03867" class="shop-link" target="_blank" rel="nofollow sponsored noopener noreferrer">🛒 Visita Negozio</a>
                    <p class="disclaimer">Come Affiliato Amazon, ricevo una commissione.</p>
                </div>

                <div class="country-card" data-category="personal" data-country="españa spain">
                    <h3 class="country-name"><span class="flag">🇪🇸</span>España</h3>
                    <p class="description">¡Explora mi tienda Amazon con productos destacados!</p>
                    <a href="https://amzlink.to/b03867" class="shop-link" target="_blank" rel="nofollow sponsored noopener noreferrer">🛒 Visitar Tienda</a>
                    <p class="disclaimer">Como Afiliado de Amazon, obtengo ingresos por las compras.</p>
                </div>

                </div>

            <h2 class="section-title">⭐ Influenceur fb942837</h2>
            <div class="countries-grid">
                <div class="country-card" data-category="influencer" data-country="united states usa">
                    <h3 class="country-name"><span class="flag">🇺🇸</span>United States</h3>
                    <p class="description">Explore the shop by influencer fb942837 for the USA!</p>
                    <a href="https://amzlink.to/b03867" class="shop-link" target="_blank" rel="nofollow sponsored noopener noreferrer">⭐ Visit Shop</a>
                    <p class="disclaimer">As an Amazon Associate, I earn from qualifying purchases.</p>
                </div>
                </div>
        </main>
        
        <footer>
            <p><strong>🏆 Reussitess® Global Nexus 🏆</strong></p> 
            <p style="color: #666; margin-top: 10px;">© 2024 Tous droits réservés - Reussitess® Global Nexus</p> 
            <p style="margin-top: 10px;" id="onlineStatus">🟢 En ligne</p>
        </footer>
    </div>

    <script type="module">
        // Importe les tags et le nom de boutique depuis config.js
        import { AMAZON_TAG_DEFAULT, AMAZON_TAG_FRANCE, SHOP_NAME_FRANCE } from './config.js';
        
        let deferredPrompt;
        
        // --- LOGIQUE PWA/Service Worker ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(reg => console.log('✅ SW enregistré'))
                    .catch(err => console.log('❌ Échec SW:', err));
            });
        }
        
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installPrompt').classList.add('show');
        });
        
        document.getElementById('installBtn').addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            await deferredPrompt.userChoice;
            deferredPrompt = null;
            document.getElementById('installPrompt').classList.remove('show');
        });
        
        document.getElementById('dismissBtn').addEventListener('click', () => {
            document.getElementById('installPrompt').classList.remove('show');
        });
        
        function updateOnlineStatus() {
            const el = document.getElementById('onlineStatus');
            el.innerHTML = navigator.onLine ? '🟢 En ligne' : '🔴 Hors ligne';
        }
        
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        
        const searchBox = document.getElementById('searchBox');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const cards = document.querySelectorAll('.country-card');
        const shopLinks = document.querySelectorAll('.shop-link');
        const noResults = document.getElementById('noResults');
        
        // --- LOGIQUE AFFILIATION FRANCE ---
        function setAffiliateLinks() {
            
            // Cible la seule boutique France : id="link-france"
            const linkFrance = document.getElementById('link-france');
            
            if (linkFrance && AMAZON_TAG_FRANCE) {
                // Construit l'URL finale: amazon.fr/shop/amourguadeloupe?tag=porinus-21
                const baseUrl = `https://www.amazon.fr/shop/${SHOP_NAME_FRANCE}`; 
                linkFrance.href = `${baseUrl}?tag=${AMAZON_TAG_FRANCE}`;
            }
        }
        
        // --- LOGIQUE FILTRAGE ---
        function filterCards() {
            const searchTerm = searchBox.value.toLowerCase();
            const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;
            let visibleCount = 0;
            
            cards.forEach(card => {
                const country = card.dataset.country;
                const category = card.dataset.category;
                
                const matchesSearch = country.includes(searchTerm);
                const matchesFilter = activeFilter === 'all' || category === activeFilter;
                
                if (matchesSearch && matchesFilter) {
                    card.classList.remove('hidden');
                    visibleCount++;
                } else {
                    card.classList.add('hidden');
                }
            });
            
            noResults.classList.toggle('show', visibleCount === 0);
        }

        // --- LOGIQUE CHARGEMENT PRODUITS ---
        async function loadProducts() {
            const showcase = document.getElementById('productShowcase');
            const productsSection = document.getElementById('products-section');
            
            try {
                // Lit le fichier JSON généré par le script de build
                const response = await fetch('./products.json');
                const data = await response.json();

                if (data.success && data.items.length > 0) {
                    productsSection.style.display = 'block'; // Affiche la section titre
                    showcase.innerHTML = data.items.map(item => `
                        <div class="country-card">
                            <h3 class="country-name"><span class="flag">✨</span>${item.Title}</h3>
                            <img src="${item.ImageUrl}" alt="${item.Title}" style="width: 100%; height: 200px; object-fit: contain; border-radius: 8px; margin-bottom: 10px;">
                            <p class="description">Prix estimé: <strong>${item.Price}</strong></p>
                            <a href="${item.Link}" class="shop-link" target="_blank" rel="nofollow sponsored noopener noreferrer">🛒 Voir l'Offre</a>
                            <p class="disclaimer">Lien affilié (Tag: ${AMAZON_TAG_FRANCE})</p>
                        </div>
                    `).join('');
                }
            } catch (e) {
                console.warn("Impossible de charger les produits (fichier products.json non trouvé).", e);
            }
        }
        
        // --- ÉVÉNEMENTS ---
        searchBox.addEventListener('input', filterCards);
        
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                filterCards();
            });
        });

        // 🟢 EXÉCUTION DANS L'ORDRE
        loadProducts(); // 1. Tente d'afficher les produits dynamiques
        setAffiliateLinks(); // 2. Applique le tag sécurisé au lien France
        filterCards(); // 3. Applique le filtre initial
    </script>
</body>
</html>
