<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta http-equiv="refresh" content="0; url=https://reussitess-global-pwa.vercel.app/">
    
    <title>Redirection...</title>
    
    <meta name="description" content="Reussitess® Global - Accédez à nos 26 boutiques Amazon dans 14 pays. Excellence, Innovation, Succès.">
    <meta name="theme-color" content="#007bff">
    <link rel="manifest" href="./manifest.json">
    
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            text-align: center; 
            padding-top: 50px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #fff;
        }
        h1 { color: #fff; font-size: 2em; }
        p { color: #ccc; margin-top: 15px; }
        a { color: #ff9500; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <h1>➡️ Redirection en cours...</h1>
    <p>Vous allez être redirigé vers la page principale dans un instant.</p>
    <p>Si la redirection n'a pas lieu, cliquez ici : <a href="https://reussitess-global-pwa.vercel.app/">Continuer vers Reussitess® Global</a></p>
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // Assurez-vous que le fichier service-worker.js est bien présent
                navigator.serviceWorker.register('./service-worker.js')
                    .then(reg => console.log('✅ SW enregistré'))
                    .catch(err => console.log('❌ Échec SW:', err));
            });
        }
    </script>
</body>
</html>
