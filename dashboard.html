<script>
    document.addEventListener('DOMContentLoaded', () => {
        const authToken = localStorage.getItem('authToken');
        const userInfoDiv = document.getElementById('userInfo');
        const postForm = document.getElementById('postForm');
        const postStatusDiv = document.getElementById('post-status');

        // 1. GESTION DE L'AUTHENTIFICATION (Si non connecté, redirige)
        if (!authToken) {
            window.location.href = '/login.html';
            return; 
        }

        // Affichage simulé des infos utilisateur (ajustez si vous récupérez les données de l'API)
        userInfoDiv.innerHTML = '<p>Connecté en tant que: <strong>Utilisateur Sécurisé</strong></p>';

        // 2. GESTION DU POST 
        postForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const postContent = document.getElementById('postContent').value.trim();

            if (!postContent) {
                postStatusDiv.textContent = '❌ Veuillez entrer un message.';
                postStatusDiv.style.color = 'red';
                return;
            }

            postStatusDiv.textContent = '⏳ Publication en cours...';
            postStatusDiv.style.color = 'gray';

            try {
                const response = await fetch('VOTRE_URL_API/posts', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}` 
                    },
                    body: JSON.stringify({ content: postContent })
                });

                const data = await response.json();

                if (response.ok) {
                    postStatusDiv.textContent = '✅ Post publié avec succès !';
                    postStatusDiv.style.color = 'green';
                    document.getElementById('postContent').value = '';
                } else if (response.status === 401) {
                    // Session expirée : supprime le token et redirige
                    postStatusDiv.textContent = '❌ Session expirée. Redirection...';
                    postStatusDiv.style.color = 'red';
                    localStorage.removeItem('authToken');
                    setTimeout(() => window.location.href = '/login.html', 2000); 
                } else {
                    postStatusDiv.textContent = '❌ Échec: ' + (data.error || 'Erreur inconnue.');
                    postStatusDiv.style.color = 'red';
                }
            } catch (error) {
                postStatusDiv.textContent = '❌ Erreur réseau ou API non disponible.';
                postStatusDiv.style.color = 'red';
            }
        });

        // 3. GESTION DE LA DÉCONNEXION (ID="logoutBtn")
        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', function(e) {
                e.preventDefault();
                localStorage.removeItem('authToken'); 
                // Redirection vers la page de connexion (chemin absolu)
                window.location.href = '/login.html'; 
            });
        }
    });
</script>
