<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#007bff">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
    <title>Reussitess® - Mode Hors Ligne</title>
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .offline-container {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        
        .offline-container::after {
            content: "© REUSSITESS®";
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-size: 11px;
            color: rgba(0,0,0,0.2);
            font-weight: 500;
        }
        
        .offline-icon {
            font-size: 100px;
            margin-bottom: 25px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.2em;
        }
        
        p {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.8;
            font-size: 1.05em;
        }
        
        .btn-retry {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            padding: 16px 45px;
            border: none;
            border-radius: 50px;
            font-size: 1.15em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 25px;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
            font-weight: 600;
        }
        
        .btn-retry:hover {
            background: linear-gradient(135deg, #0056b3, #003d82);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 123, 255, 0.5);
        }

        .btn-retry:active {
            transform: translateY(-1px);
        }

        .status-text {
            margin-top: 20px;
            font-size: 0.95em;
            color: #999;
            font-style: italic;
        }

        @media (max-width: 600px) {
            .offline-container {
                padding: 40px 30px;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .offline-icon {
                font-size: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1>Mode Hors Ligne</h1>
        <p>Vous n'êtes actuellement pas connecté à Internet.</p>
        <p>L'accès à nos boutiques Amazon nécessite une connexion active.</p>
        <button class="btn-retry" onclick="checkConnection()">
            🔄 Vérifier la connexion
        </button>
        <div class="status-text" id="statusText">
            Vérification automatique en cours...
        </div>
    </div>

    <script>
        // Vérification automatique de la connexion
        function checkConnection() {
            const statusText = document.getElementById('statusText');
            statusText.textContent = 'Vérification en cours...';
            
            if (navigator.onLine) {
                statusText.textContent = '✅ Connexion détectée ! Redirection...';
                statusText.style.color = '#28a745';
                setTimeout(() => {
                    window.location.href = './';
                }, 1000);
            } else {
                statusText.textContent = '❌ Toujours hors ligne. Nouvelle tentative dans 5s...';
                statusText.style.color = '#dc3545';
            }
        }

        // Vérification automatique toutes les 5 secondes
        setInterval(checkConnection, 5000);

        // Vérification au chargement
        window.addEventListener('load', () => {
            setTimeout(checkConnection, 1000);
        });

        // Écouter l'événement online
        window.addEventListener('online', () => {
            checkConnection();
        });
    </script>

<!-- 🔒 REUSSITESS® PROTECTION -->
<script>
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('copy', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());
document.addEventListener('keydown', e => {
    if (e.ctrlKey && ['c','x','u','s','a','p'].includes(e.key.toLowerCase())) e.preventDefault();
    if (e.key === 'F12') e.preventDefault();
});
setInterval(() => { debugger; }, 100);
console.log('%c🔒 REUSSITESS® - Contenu protégé', 'color:red;font-size:20px;font-weight:bold');
</script>
</body>
</html>
